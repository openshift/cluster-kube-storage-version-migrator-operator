apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: migrator
  namespace: openshift-kube-storage-version-migrator
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: migrator
      kube-storage-version-migrator.openshift.io/component: migrator
